<title>Rave-Skizzenblock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Hardware-Rack. Transport oben, Ideen-Liste links, Step-Raster und Klang-Panel rechts.
   Bewusst nur ein (dunkles) Theme: Club-Licht, UV-Violett für aktive Steps, Amber für Akzente und Playhead. */
:root{
  --bg:#0e0d13;
  --panel:#16141d;
  --raise:#1f1c29;
  --raise-2:#282436;
  --line:#2e2a3c;
  --fg:#ece8f4;
  --muted:#958eab;
  --uv:#9f7eff;
  --uv-ink:#140d2b;
  --uv-soft:#3b3070;
  --amber:#ffb547;
  --amber-ink:#2a1a00;
  --danger:#ff5d73;
  --ok:#5fd4a0;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
label,.h,.legend,.brand{-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.app{max-width:1440px;margin:0 auto;padding-block:16px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}

/* Kopfzeile */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand b{color:var(--uv);font-weight:800}
.idea-name{flex:1 1 220px;min-width:0;background:transparent;border:1px solid transparent;border-radius:6px;
  padding:6px 8px;font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.01em}
@media (hover:hover){.idea-name:hover{border-color:var(--line)}}
.idea-name:focus{border-color:var(--uv);outline:none;background:var(--panel)}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill[data-s="saved"]::before{background:var(--ok)}
.pill[data-s="saving"]::before{background:var(--amber)}
.pill[data-s="error"]::before{background:var(--danger)}

/* Transport */
.transport{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:9;box-shadow:0 10px 24px -12px var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--raise);border:0;height:32px;padding:0 12px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.t-more{display:contents}
.t-more-btn{display:none}
.stepb{width:34px;padding:0;font-size:17px;line-height:1}
.play{font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--uv);color:var(--uv-ink);border:0;border-radius:8px;padding:12px 18px;min-width:108px;cursor:pointer}
.play[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink)}
.field{display:flex;flex-direction:column;gap:3px}
.field>span{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.field input[type=number],.field select,.select{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 8px;height:34px}
.field input[type=number]{width:62px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.field input[type=number]::-webkit-inner-spin-button,.field input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.inline{display:flex;gap:6px;align-items:center}
.swing{width:110px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pats{display:flex;gap:4px}
.pat{width:38px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--raise);font-family:var(--f-display);font-weight:600;cursor:pointer;position:relative}
.pat.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pat.empty:not(.sel){color:var(--muted)}
.pat.playing::after{content:"";position:absolute;left:50%;bottom:-6px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--amber)}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:0 12px;height:34px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
@media (hover:hover){.btn:hover{background:var(--raise-2)}}
.btn.on{background:var(--uv);border-color:var(--uv);color:var(--uv-ink)}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn:disabled{opacity:.5;cursor:default}
.meter{display:flex;align-items:center;gap:8px;margin-left:auto}
.meter canvas{width:140px;height:14px;border-radius:3px;background:var(--raise);display:block}
.meter output{font-size:12px;color:var(--muted);width:56px;text-align:right}

/* Hauptbereich */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.ideas{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.h{font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.newrow{display:flex;flex-wrap:wrap;gap:6px}
.newrow .btn{flex:1 1 auto;padding:0 8px;font-size:12px}
.ilist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:340px;overflow:auto}
.ilist button{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:7px 9px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
@media (hover:hover){.ilist button:hover{background:var(--raise)}}
.ilist button.cur{background:var(--raise);border-color:var(--uv-soft)}
.ilist .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ilist .m{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.empty-note{font-size:12.5px;color:var(--muted);margin:0}
.ideas textarea{width:100%;min-height:96px;resize:vertical;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:13px}
.ideas .acts{display:flex;gap:6px}
.ideas .acts .btn{flex:1}

.rack{display:flex;flex-direction:column;gap:14px;min-width:0}
.gridbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.gridtools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.row{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;align-items:center}
.head{display:grid;grid-template-columns:1fr auto auto;grid-template-rows:auto auto;gap:3px 4px;align-items:center}
.tname{grid-column:1;text-align:left;background:none;border:0;padding:2px 0;font-weight:700;font-size:13.5px;cursor:pointer}
.tname.sel{color:var(--uv)}
.tname small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.ms{width:26px;height:24px;border-radius:5px;border:1px solid var(--line);background:var(--raise);font-size:11px;font-weight:700;cursor:pointer;color:var(--muted)}
.ms.mute.on{background:var(--danger);border-color:var(--danger);color:#2b0710}
.ms.solo.on{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.head input[type=range]{grid-column:1 / -1;height:16px}
.steps{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px}
.step{height:38px;border-radius:5px;border:1px solid var(--line);background:var(--raise);cursor:pointer;padding:0;position:relative;
  font-family:var(--f-mono);font-size:10px;color:var(--uv-ink);overflow:hidden;transition:background-color .06s}
.step.beat{background:var(--raise-2)}
.step:nth-child(4n+1):not(:first-child){margin-left:6px}
.step.on{background:var(--uv);border-color:var(--uv)}
.step.acc{background:var(--amber);border-color:var(--amber)}
.step.acc::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--amber-ink);opacity:.35}
.step.ghost{background:var(--uv-soft);border-color:var(--uv-soft)}
.step:disabled{cursor:default}
.step.ph{box-shadow:0 0 0 2px var(--fg) inset}
.step:active:not(:disabled),.rc:active{transform:scale(.93)}
.step span{font-weight:600;font-size:10px;letter-spacing:-.02em}
.row.bus .step{height:16px}

/* Klang-Panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;padding:0 6px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:11px 12px 9px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--uv)}
.pbody{padding:16px;display:flex;flex-direction:column;gap:16px}
.hint{font-size:12.5px;color:var(--muted);margin:0;max-width:70ch}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px 22px}
.param{display:flex;flex-direction:column;gap:2px;min-width:0}
.param .lab{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.param .lab output{color:var(--fg);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.param select{background:var(--raise);border:1px solid var(--line);border-radius:6px;height:32px;padding:0 8px}
.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--uv)}
.group{display:flex;flex-direction:column;gap:10px}
.group+.group{border-top:1px solid var(--line);padding-top:14px}

.select,.param select{-webkit-appearance:none;appearance:none;padding-right:28px;background-repeat:no-repeat;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:var(--fg);border:3px solid var(--uv)}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--fg);border:3px solid var(--uv)}

.roll-wrap{overflow-x:auto}
.roll{display:grid;grid-template-columns:44px repeat(16,minmax(22px,1fr));gap:2px;min-width:480px}
.rlab{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);display:flex;align-items:center;padding-left:2px}
.rlab.root{color:var(--fg);font-weight:600}
.rc{height:20px;border:0;border-radius:3px;background:var(--raise);cursor:pointer;padding:0}
.rc.beat{background:var(--raise-2)}
.rc.root{box-shadow:0 1px 0 var(--uv-soft) inset}
.rc:nth-child(17n+6),.rc:nth-child(17n+10),.rc:nth-child(17n+14){margin-left:4px}
.rc.on{background:var(--uv)}
.rc.ph{outline:1px solid var(--fg);outline-offset:-1px}

/* Song */
.songhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.songlen{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1}
.seclist{display:flex;flex-direction:column;gap:6px}
.sec{border:1px solid var(--line);border-radius:8px;background:var(--raise);overflow:hidden}
.sec.open{border-color:var(--uv-soft);background:var(--bg)}
.sec.playing{border-color:var(--amber)}
.shead{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:5px 10px;align-items:center;background:none;border:0;padding:10px 12px;text-align:left;cursor:pointer}
.stime,.sbars{color:var(--muted);font-size:12px}
.sname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sseq{color:var(--uv);font-size:12px;letter-spacing:.1em}
.sdots{grid-column:2 / -1;display:flex;gap:3px}
.sdots i{width:16px;height:5px;border-radius:2px;background:var(--line)}
.sdots i.on{background:var(--uv)}
.sedit{display:flex;flex-direction:column;gap:14px;padding:12px 12px 14px;border-top:1px solid var(--line)}
.srow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.srow>.lbl{flex:0 0 100%;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.chip{height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--uv);border-color:var(--uv);color:var(--uv-ink)}
.chip.sq{border-radius:6px;min-width:34px;padding:0 8px;font-family:var(--f-display);color:var(--fg)}
.sec input[type=text]{background:var(--raise);border:1px solid var(--line);border-radius:6px;height:34px;padding:0 8px;min-width:0;flex:1 1 140px}
.seqshow{font-family:var(--f-mono);letter-spacing:.22em;color:var(--uv);font-weight:600;font-size:15px;min-width:3ch}
.barsval{font-family:var(--f-mono);min-width:76px;text-align:center}
.export{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:16px}
.exopts{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:end}
.exlist{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:3px;max-width:75ch}
.exlist b{color:var(--fg);font-weight:600}
.progress{font-family:var(--f-mono);font-size:12px;color:var(--amber);min-height:1.2em}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);
  padding:9px 14px;border-radius:8px;font-weight:600;font-size:13px;max-width:calc(100% - 32px);z-index:20}

/* Untere Leiste (nur Handy) */
.nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:15;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;
  background:var(--panel);background:color-mix(in srgb,var(--panel) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{background:none;border:0;cursor:pointer;padding:0}
.nitem{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;color:var(--muted);font-size:11px;font-weight:600}
.nitem svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nitem[aria-current="page"]{color:var(--fg)}
.nitem[aria-current="page"] svg{stroke:var(--uv)}
.nav .nplay{justify-self:center;width:66px;height:66px;border-radius:50%;background:var(--uv);color:var(--uv-ink);margin-top:-24px;
  box-shadow:0 0 0 5px var(--bg),0 8px 22px rgba(0,0,0,.5);display:grid;place-items:center}
.nav .nplay[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink)}
.nplay svg{width:26px;height:26px;fill:currentColor}
.nplay .i-stop,.nplay[aria-pressed="true"] .i-play{display:none}
.nplay[aria-pressed="true"] .i-stop{display:block}

@media (pointer: coarse){
  .kbd-hint{display:none}
  input,select,textarea,.ideas textarea{font-size:16px}  /* iOS zoomt sonst beim Antippen */
  input[type=range]{height:40px}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px}
  input[type=range]::-webkit-slider-thumb{width:28px;height:28px;margin-top:-11px}
  .head input[type=range]{height:36px}
  .check{min-height:44px}
  .check input{width:22px;height:22px}
}
@media (max-width: 960px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .ideas{order:2}
  .meter{margin-left:0}
}
@media (max-width: 760px){
  .app{gap:10px;padding-block:10px 112px}
  .brand{display:none}
  .top{flex-wrap:nowrap;gap:8px}
  .idea-name{flex:1 1 0;font-size:17px;padding:6px 4px}
  .pill{padding:9px}
  .pill .pt{display:none}
  .transport{padding:8px;gap:8px;border-radius:12px}
  .play.t-desk{display:none}
  .t-pat{flex:1 1 100%;min-width:0}
  .t-mode{flex:1 1 auto}
  .t-mode>span:first-child{display:none}
  .seg{display:flex;width:100%}
  .seg button{flex:1;height:42px;font-size:14px}
  .chip{height:40px;padding:0 13px;font-size:13.5px}
  .chip.sq{min-width:40px}
  .sec input[type=text]{height:44px;flex:1 1 100%}
  .barsval{flex:1}
  .shead{padding:13px 12px}
  .t-pat>span:first-child{display:none}
  .pats{flex:1;gap:5px}
  .pat{flex:1;width:auto;min-width:0;height:42px;font-size:14px}
  .btn{height:44px;padding:0 13px;font-size:14px}
  .stepb{width:44px;padding:0;font-size:20px}
  .t-more-btn{display:inline-flex;align-items:center;gap:5px;padding:0 10px}
  .t-more{display:none}
  .transport.open .t-more{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 16px;width:100%;padding:10px 4px 4px;border-top:1px solid var(--line)}
  .t-more .wide{grid-column:1 / -1}
  .t-more .inline{flex-wrap:wrap}
  .swing{width:100%}
  .field select,.select,.field input[type=number]{height:44px}
  .t-more .select{flex:1}
  .meter canvas{flex:1;width:auto;min-width:0}
  .layout{display:block}
  .ideas,.gridbox,.panel{display:none}
  .app[data-view="beat"] .gridbox{display:flex}
  .app[data-view="sound"] .panel{display:block}
  .app[data-view="ideas"] .ideas{display:flex}
  .gridbox{padding:10px 12px 4px;gap:0}
  .gridtools{padding-bottom:8px}
  .row{grid-template-columns:minmax(0,1fr);gap:6px;padding-block:10px;border-top:1px solid var(--line)}
  .head{display:flex;gap:8px}
  .tname{flex:0 0 96px;font-size:15px;padding:8px 0}
  .tname::after{content:" ›";color:var(--muted);font-weight:400}
  .tname small{display:none}
  .head input[type=range]{flex:1;order:1;min-width:0}
  .ms{order:2;width:40px;height:38px;font-size:13px}
  .steps{grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
  .step{height:46px;border-radius:7px}
  .step span{font-size:12px}
  .step:nth-child(4n+1):not(:first-child){margin-left:0}
  .step:nth-child(8n+5){margin-left:6px}
  .row.bus .steps{display:none}
  .tab{padding:14px 14px 12px;font-size:14px}
  .tab[data-id="song"]{display:none}
  .app[data-song] .tabs{display:none}
  .pbody{padding:14px 12px}
  .params{grid-template-columns:minmax(0,1fr);gap:10px}
  .param .lab{font-size:13px}
  .param select{height:44px}
  .roll{grid-template-columns:46px repeat(16,34px);min-width:0;width:max-content;gap:3px}
  .rlab{position:sticky;left:0;z-index:1;background:var(--panel);font-size:11.5px}
  .rc{height:32px;border-radius:5px}

<script>
(() => {
'use strict';

/* ---------- Hilfen ---------- */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids) if (c !== null && c !== undefined) e.append(c);
  return e;
}
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let toastT = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200);
}

/* ---------- Musik-Konstanten ---------- */
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SCALES = {
  minor:    { name: 'Moll',       iv: [0,2,3,5,7,8,10] },
  phrygian: { name: 'Phrygisch',  iv: [0,1,3,5,7,8,10] },
  harmonic: { name: 'Harm. Moll', iv: [0,2,3,5,7,8,11] },
  dorian:   { name: 'Dorisch',    iv: [0,2,3,5,7,9,10] }
};
// Ableton-Schreibweise: MIDI 60 = C3
const noteLabel = m => NOTE_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 2);
const keyLabel = I => NOTE_NAMES[I.root] + '-' + SCALES[I.scale].name;
function degMidi(I, d, base) {
  const iv = SCALES[I.scale].iv;
  const o = Math.floor(d / 7), i = ((d % 7) + 7) % 7;
  return base + 12 * o + iv[i];
}
const baseFor = (I, track) => 12 * (I.sound[track].octave + 1) + I.root;
const ROLL_TOP = 14;
const PAT_KEYS = ['A','B','C','D','E','F','G','H'];

const TRACKS = [
  { id: 'kick',   name: 'Kick',     type: 'drum', tab: 'kick' },
  { id: 'rumble', name: 'Rumble',   type: 'bus',  tab: 'rumble', sub: 'folgt der Kick' },
  { id: 'clap',   name: 'Clap',     type: 'drum', tab: 'drums' },
  { id: 'hat',    name: 'Hi-Hat',   type: 'drum', tab: 'drums' },
  { id: 'ohat',   name: 'Open Hat', type: 'drum', tab: 'drums' },
  { id: 'bass',   name: 'Bass',     type: 'mel',  tab: 'bass' },
  { id: 'lead',   name: 'Lead',     type: 'mel',  tab: 'lead' },
  { id: 'pluck',  name: 'Pluck',    type: 'mel',  tab: 'pluck' }
];
const DRUMS = ['kick','clap','hat','ohat'];
const MELS = ['bass','lead','pluck'];
const CHANNELS = [...TRACKS.map(t => t.id), 'fx'];
const CH_NAMES = Object.assign(Object.fromEntries(TRACKS.map(t => [t.id, t.name])), { fx: 'FX' });

/* ---------- Datenmodell ---------- */
function emptyPattern() {
  return {
    kick: Array(16).fill(0), clap: Array(16).fill(0), hat: Array(16).fill(0), ohat: Array(16).fill(0),
    bass: Array(16).fill(null), lead: Array(16).fill(null), pluck: Array(16).fill(null)
  };
}
function defaultSound() {
  return {
    kick:   { start: 420, end: 52, pdecay: 0.045, decay: 0.42, click: 0.35, drive: 0.55, tone: 7000 },
    rumble: { send: 0, size: 1.4, drive: 0.6, cutoff: 180, duck: 0.9 },
    clap:   { decay: 0.2, tone: 1400 },
    hat:    { decay: 0.045 },
    ohat:   { decay: 0.22 },
    bass:   { wave: 'sawtooth', octave: 2, sub: 0.5, cutoff: 420, res: 0.35, env: 0.5, decay: 0.16, drive: 0.4 },
    lead:   { octave: 4, chord: true, detune: 22, cutoff: 5200, attack: 0.004, gate: 0.9, release: 0.22 },
    pluck:  { octave: 4, detune: 10, cutoff: 1500, env: 0.6, decay: 0.16, gate: 0.7, release: 0.1 },
    master: { drive: 0.3, vol: 0.85 }
  };
}
function defaultMix() {
  const m = (vol, verb = 0, extra = {}) => Object.assign({ vol, verb, mute: false, solo: false }, extra);
  return {
    kick: m(0.9), rumble: m(0.75), clap: m(0.78, 0.25), hat: m(0.55, 0.04), ohat: m(0.58, 0.1),
    bass: m(0.62), lead: m(0.5, 0.3, { delay: 0.18 }), pluck: m(0.66, 0.25, { delay: 0.3 }), fx: m(0.6, 0.35)
  };
}
function newSection(o = {}) {
  return Object.assign({ name: 'Teil', seq: 'A', bars: 8, off: {}, crash: false, riser: false, roll: false, sweep: false, gap: false }, o);
}
function baseIdea() {
  return {
    v: 2, id: uid(), name: 'Neue Idee', notes: '', bpm: 150, swing: 0, root: 9, scale: 'minor',
    patterns: Object.fromEntries(PAT_KEYS.map(k => [k, emptyPattern()])),
    song: [], sound: defaultSound(), mix: defaultMix(), updated: 0
  };
}
const drum = s => [...s].map(c => c === 'X' ? 2 : c === 'x' ? 1 : 0);
const mel = o => Array.from({ length: 16 }, (_, i) => (i in o ? { d: o[i] } : null));

// Zufallsgenerator mit Startwert: gleiche Zahl ergibt gleiche Idee
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const CHORD_Q = ['m', 'dim', '', 'm', 'm', '', ''];  // natürliches Moll: i ii° III iv v VI VII
const chordName = (I, c) => NOTE_NAMES[(I.root + SCALES.minor.iv[c]) % 12] + CHORD_Q[c];

/* Melodischer Bounce mit Hardtechno-Kante: 4-Takt-Akkordfolge, Offbeat-Bass, Stabs, Pluck-Melodie,
   dazu ein fertiges Arrangement mit wenigen, kurzen Breaks. */
function generateBounce(seed) {
  const R = rng(seed), pick = a => a[Math.floor(R() * a.length)];
  const I = baseIdea();
  I.name = pick(['Nachtfahrt','Neonregen','Kellerlicht','Stroboskop','Hochdruck','Funkenflug','Überholspur','Sturmfrei','Kurzschluss','Dauerfeuer','Betonherz','Lichtbogen','Nordkurve','Rauschzustand']);
  I.bpm = pick([155, 156, 158, 158, 160]);
  I.root = pick([4, 5, 6, 7, 9]);   // E, F, F#, G, A
  I.scale = 'minor';
  const prog = pick([[0,5,2,6],[0,5,6,4],[5,6,0,0],[0,2,6,5],[0,6,5,6],[5,0,2,6],[0,3,5,6],[0,5,3,6]]);

  // Klang: Kick auf den Grundton gestimmt, härter verzerrt, leichte Rumble für Gewicht
  Object.assign(I.sound.kick, { start: pick([480, 520, 560]), end: Math.round(mtof(24 + I.root)), pdecay: 0.035, decay: pick([0.34, 0.38, 0.42]), click: 0.45, drive: pick([0.62, 0.68, 0.74]), tone: 7500 });
  Object.assign(I.sound.rumble, { send: 0.2, size: 1.0, drive: 0.6, cutoff: 150, duck: 0.95 });
  Object.assign(I.sound.bass, { wave: 'sawtooth', octave: 1, sub: 0.25, cutoff: 520, res: 0.4, env: 0.6, decay: 0.14, drive: 0.6 });
  Object.assign(I.sound.lead, { octave: 3, chord: true, detune: 24, cutoff: 5200, attack: 0.004, gate: 0.7, release: 0.14 });
  Object.assign(I.sound.pluck, { octave: 4, detune: 12, cutoff: pick([1300, 1600, 1900]), env: 0.65, decay: 0.16, gate: 0.7, release: 0.1 });
  Object.assign(I.sound.clap, { decay: 0.22, tone: 1300 });
  I.mix.rumble.vol = 0.6; I.mix.hat.vol = 0.5; I.mix.ohat.vol = 0.6; I.mix.bass.vol = 0.7;
  I.mix.lead.vol = 0.52; I.mix.lead.delay = 0.12; I.mix.pluck.vol = 0.7;

  // Bass: Grundton der Akkorde um den Grundton der Tonart gelegt, mit Oktavsprung
  const bRoot = c => (c <= 2 ? c + 7 : c);
  const bAlt = b => (b + 7 <= ROLL_TOP ? b + 7 : b - 7);
  const bassRs = [['.', '.', 'r', 'a'], ['.', 'r', 'r', 'a'], ['.', '.', 'r', 'r'], ['.', 'a', 'r', 'a']];
  const bassR1 = pick(bassRs), bassR2 = pick(bassRs.filter(x => x !== bassR1));
  const bassBar = (c, rh) => {
    const o = {};
    for (let beat = 0; beat < 4; beat++) rh.forEach((x, k) => { if (x !== '.') o[beat * 4 + k] = x === 'r' ? bRoot(c) : bAlt(bRoot(c)); });
    return mel(o);
  };
  // Stabs: Dreiklänge im Rhythmus
  const stabR = pick([[2, 6, 10, 14], [0, 3, 6, 8, 11, 14], [3, 6, 11, 14], [0, 3, 6, 10, 14]]);
  const stabBar = c => mel(Object.fromEntries(stabR.map(st => [st, c])));
  // Melodie: nur Akkordtöne, gleiche Kontur über jeden Akkord (das macht sie eingängig), Takt 4 läuft rückwärts
  const ladder = c => { const pcs = [c % 7, (c + 2) % 7, (c + 4) % 7], out = []; for (let d = 3; d <= 13; d++) if (pcs.includes(d % 7)) out.push(d); return out; };
  const melRs = [[0, 3, 6, 8, 11, 14], [0, 2, 3, 6, 8, 10, 11, 14], [0, 3, 4, 6, 8, 11, 12, 14], [2, 3, 6, 7, 10, 11, 14, 15], [0, 3, 6, 7, 8, 11, 14, 15]];
  const contour = n => { const c = [pick([1, 2, 3])]; for (let i = 1; i < n; i++) c.push(Math.max(0, Math.min(4, c[i - 1] + pick([-2, -1, -1, 1, 1, 2, 0])))); return c; };
  const melBar = (c, rh, con) => { const L = ladder(c); return mel(Object.fromEntries(rh.map((st, i) => [st, L[Math.min(L.length - 1, con[i])]]))); };
  const melR1 = pick(melRs), melR2 = pick(melRs.filter(x => x !== melR1));
  const con1 = contour(melR1.length), con2 = contour(melR2.length);

  const hats = ['xxXxxxXxxxXxxxXx', 'x.Xxx.Xxx.Xxx.Xx', '.xXx.xXx.xXx.xXx'];
  const hatA = pick(hats), hatB = pick(hats.filter(x => x !== hatA));
  const kEnd1 = pick(['X...x...x...x.x.', 'X...x...x...x..x', 'X...x...x..x..x.']);
  const kEnd2 = pick(['X...x...x...xxxx', 'X...x...x.x.x.xx']);
  const mk = (i, hat, kEnd, clapEnd, bR, mR, con) => {
    const c = prog[i], last = i === 3, p = emptyPattern();
    p.kick = drum(last ? kEnd : 'X...x...x...x...');
    p.clap = drum(last ? clapEnd : '....x.......x...');
    p.hat = drum(hat); p.ohat = drum('..x...x...x...x.');
    p.bass = bassBar(c, bR); p.lead = stabBar(c);
    p.pluck = melBar(c, mR, last ? con.slice().reverse() : con);
    return p;
  };
  ['A','B','C','D'].forEach((k, i) => { I.patterns[k] = mk(i, hatA, kEnd1, '....x.......x.xx', bassR1, melR1, con1); });
  ['E','F','G','H'].forEach((k, i) => { I.patterns[k] = mk(i, hatB, kEnd2, '....x...x...x.xx', bassR2, melR2, con2); });

  // Arrangement: 136 Takte, die Kick läuft fast durch, nur ein kurzer Break
  const S = (name, seq, bars, off, fx) => newSection(Object.assign({ name, seq, bars, off: Object.fromEntries((off || []).map(t => [t, true])) }, fx || {}));
  I.song = [
    S('Intro',        'ABCD',  8, ['clap','ohat','bass','lead','pluck'], { riser: true }),
    S('Aufbau',       'ABCD',  8, ['lead'], { crash: true, sweep: true, riser: true, roll: true }),
    S('Drop 1',       'ABCD', 16, [], { crash: true }),
    S('Drive',        'ABCD',  8, ['pluck'], { crash: true, roll: true, gap: true }),
    S('Drop 1 zurück','ABCD', 16, [], { crash: true, riser: true }),
    S('Kurzer Break', 'ABCD',  8, ['kick','hat','bass'], { crash: true, sweep: true, riser: true, roll: true }),
    S('Drop 2',       'EFGH', 16, [], { crash: true }),
    S('Drop 2 hoch',  'EFGH', 16, [], { crash: true, roll: true, gap: true }),
    S('Drive 2',      'EFGH',  8, ['pluck'], { crash: true, riser: true }),
    S('Finale',       'ABCD', 16, [], { crash: true }),
    S('Outro',        'ABCD',  8, ['lead','pluck','clap'], { crash: true }),
    S('Ausklang',     'ABCD',  8, ['lead','pluck','clap','bass','ohat'], {})
  ];
  I.notes = `Melodischer Bounce mit Hardtechno-Kante.\nAkkorde: ${prog.map(c => chordName(I, c)).join(' – ')} (je ein Takt)\nKick ist auf ${NOTE_NAMES[I.root]} gestimmt. Patterns A–D = Thema 1, E–H = Thema 2.`;
  return I;
}

const TEMPLATES = {
  hardtechno() {
    const I = baseIdea();
    Object.assign(I, { name: 'Hardtechno-Skizze', bpm: 160, root: 5, scale: 'phrygian',
      notes: 'Rollende Rumble-Kick, durchlaufende 16tel-Hats, düsterer Stab auf der kleinen Sekunde.' });
    Object.assign(I.sound.kick, { start: 380, end: 48, pdecay: 0.06, decay: 0.55, click: 0.25, drive: 0.82, tone: 4500 });
    Object.assign(I.sound.rumble, { send: 0.75, size: 1.6, drive: 0.7, cutoff: 170, duck: 0.95 });
    Object.assign(I.sound.lead, { octave: 3, chord: false, detune: 12, cutoff: 2600, gate: 0.6, release: 0.12 });
    Object.assign(I.sound.clap, { decay: 0.28, tone: 1200 });
    I.mix.lead.verb = 0.4; I.mix.lead.delay = 0.35; I.mix.clap.verb = 0.35;
    const A = I.patterns.A;
    A.kick = drum('X...x...x...x...');
    A.clap = drum('....x.......x...');
    A.hat  = drum('xxXxxxXxxxXxxxXx');
    A.ohat = drum('..x...x...x...x.');
    A.lead = mel({ 3: 1, 11: 1, 14: 0 });
    const B = clone(A);
    B.clap = drum('....x.......x..x');
    B.lead = mel({ 3: 1, 7: 1, 11: 1, 14: 0, 15: 1 });
    I.patterns.B = B;
    I.song = [
      newSection({ name: 'Intro', seq: 'A', bars: 8, off: { clap: true, lead: true }, riser: true }),
      newSection({ name: 'Hauptteil', seq: 'AB', bars: 16, crash: true, roll: true }),
      newSection({ name: 'Variation', seq: 'ABBB', bars: 16, crash: true, riser: true }),
      newSection({ name: 'Outro', seq: 'A', bars: 8, off: { lead: true, clap: true }, crash: true })
    ];
    return I;
  },
  blank() {
    const I = baseIdea();
    Object.assign(I, { name: 'Leere Idee', bpm: 155 });
    I.patterns.A.kick = drum('X...x...x...x...');
    return I;
  }
};

function merge(def, val) {
  if (Array.isArray(def)) return Array.isArray(val) ? val : def;
  if (def && typeof def === 'object') {
    const v = val && typeof val === 'object' && !Array.isArray(val) ? val : {};
    const o = {};
    for (const k of Object.keys(def)) o[k] = merge(def[k], v[k]);
    for (const k of Object.keys(v)) if (!(k in o)) o[k] = v[k];
    return o;

    uiQueue.push({ t: play.next + swingOff(play.step, sd), step: play.step, pat: en.pat, si: en.si, bar: en.bar });
    play.next += sd;
    play.step++;
    if (play.step === 16) { play.step = 0; if (play.list) play.idx++; }
  }
}
function startPlay() {
  ensureAudio();
  if (matchMedia('(pointer: coarse)').matches && !LS.get('rsb:soundHint')) {
    LS.set('rsb:soundHint', '1'); toast('Kein Ton? Lautstärke hoch und Lautlos-Schalter aus.');
  }
  eng.update();
  play.on = true; play.step = 0; play.endAt = 0; play.pat = editPat;
  if (playMode === 'song') { selSec = Math.min(selSec, idea.song.length - 1); play.list = songEntries(selSec); play.idx = 0; }
  else { play.list = null; eng.sweep(actx.currentTime, 0); }
  play.next = actx.currentTime + 0.08;
  timer = setInterval(tick, 25); tick();
  renderTransportState();
}
function stopPlay() {
  play.on = false; clearInterval(timer); uiQueue.length = 0; play.endAt = 0;
  if (eng) eng.panic();
  songPos = { si: -1, bar: 0 }; markSongPos();
  setPlayhead(-1, null); renderTransportState();
}
function togglePlay() { play.on ? stopPlay() : startPlay(); }
function setMode(m) {
  if (m === playMode) return;

  playMode = m; LS.set('rsb:mode', m); renderTransport();
  if (was) startPlay();
}

function audition(only, deg) {
  if (play.on) return;
  ensureAudio(); eng.update();
  const p = emptyPattern();
  if (MELS.includes(only)) p[only][0] = { d: deg ?? lastDeg[only] ?? 0 };
  else if (only === 'rumble') p.kick[0] = 1;
  else p[only][0] = 1;
  eng.trigger(p, 0, actx.currentTime + 0.02, stepDur(), { only: only === 'rumble' ? 'kick' : only });
}

/* Pegelanzeige und Playhead */
let meterBuf = null, peakHold = 0, meterCol = null;
function frame() {
  requestAnimationFrame(frame);
  if (!actx) return;
  const now = actx.currentTime;
  let cur = null;
  while (uiQueue.length && uiQueue[0].t <= now) cur = uiQueue.shift();
  if (cur && play.on) {
    setPlayhead(cur.step, cur.pat);
    if (cur.si !== songPos.si || cur.bar !== songPos.bar) { songPos = { si: cur.si, bar: cur.bar }; markSongPos(); }
  }
  if (play.on && play.endAt && now >= play.endAt) { stopPlay(); toast('Song zu Ende'); }
  const an = eng.analyser; if (!an) return;
  if (!meterBuf) meterBuf = new Float32Array(an.fftSize);
  an.getFloatTimeDomainData(meterBuf);
  let pk = 0; for (let i = 0; i < meterBuf.length; i++) { const a = Math.abs(meterBuf[i]); if (a > pk) pk = a; }
  peakHold = Math.max(pk, peakHold * 0.94);
  const cv = $('#meter'); if (!cv.offsetParent) return;
  const c = cv.getContext('2d'), w = cv.width, h = cv.height;
  const db = 20 * Math.log10(peakHold + 1e-9), x = Math.max(0, Math.min(1, (db + 48) / 48));
  c.clearRect(0, 0, w, h);
  if (!meterCol) { const css = getComputedStyle(document.documentElement); meterCol = ['--danger', '--amber', '--uv'].map(v => css.getPropertyValue(v).trim()); }
  c.fillStyle = db > -1 ? meterCol[0] : db > -6 ? meterCol[1] : meterCol[2];
  c.fillRect(0, 0, w * x, h);
  $('#meterOut').textContent = (db < -60 ? '–∞' : db.toFixed(1)) + ' dB';
}

/* ---------- Speichern ---------- */
const Store = {
  db: null, cloud: false, list: [],
  initLocal() {
    let idx = [];
    try { idx = JSON.parse(LS.get('rsb:index') || '[]'); } catch (e) { idx = []; }
    this.list = idx.filter(m => m && m.id && LS.get('rsb:idea:' + m.id)).map(m => ({ ...m, json: LS.get('rsb:idea:' + m.id) }));
  },
  writeLocalIndex() {
    LS.set('rsb:index', JSON.stringify(this.list.map(({ json, ...m }) => m)));
  },
  async initCloud() {
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    let db = null;
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) return;
    this.db = db;
    let first = true;
    db.collection('ideas').orderBy('updated', 'desc').onSnapshot(snap => {
      this.cloud = true;
      this.list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (first) {
        first = false;
        // Auf einem neuen Gerät: zuletzt bearbeitete Idee statt Beispiel öffnen
        if (isDraftTemplate && this.list.length) { try { loadIdea(JSON.parse(this.list[0].json)); } catch (e) {} }
      }
      renderIdeas(); setSaveState(saveState);
    }, err => {
      console.warn('db', err); this.cloud = false; this.db = null; setSaveState('error', 'Cloud-Speicher nicht erreichbar, speichere lokal');
    });
  },
  async save(I) {
    const rec = { name: I.name, updated: I.updated, bpm: I.bpm, key: keyLabel(I), json: JSON.stringify(I) };
    LS.set('rsb:last', I.id);
    LS.set('rsb:draft', rec.json);
    if (this.db) { await this.db.collection('ideas').doc(I.id).set(rec); return; }
    LS.set('rsb:idea:' + I.id, rec.json);
    this.list = [{ id: I.id, ...rec }, ...this.list.filter(x => x.id !== I.id)].sort((a, b) => b.updated - a.updated);
    this.writeLocalIndex(); renderIdeas();
  },
  async remove(id) {
    LS.del('rsb:idea:' + id);
    if (this.db) { await this.db.collection('ideas').doc(id).delete(); return; }
    this.list = this.list.filter(x => x.id !== id); this.writeLocalIndex(); renderIdeas();
  }
};

function stepClick(t, i) {
  const P = idea.patterns[editPat];
  if (t.type === 'drum') {
    P[t.id][i] = (P[t.id][i] + 1) % 3;
    if (P[t.id][i] === 1) audition(t.id);
  } else if (t.type === 'mel') {
    if (P[t.id][i]) P[t.id][i] = null;
    else { P[t.id][i] = { d: lastDeg[t.id] || 0 }; audition(t.id, P[t.id][i].d); }
    if (panelTab === t.id) renderRoll(t.id);
  }
  markDirty(); renderGrid(); renderTransport();
}

function renderGrid() {
  const g = $('#grid'); g.textContent = '';
  gridCells = Array.from({ length: 16 }, () => []);
  const P = idea.patterns[editPat];
  const rumbleOn = idea.sound.rumble.send > 0.01;
  for (const t of TRACKS) {
    const m = idea.mix[t.id];
    const head = el('div', { class: 'head' },
      el('button', { class: 'tname' + (panelTab === t.tab ? ' sel' : ''), onclick: () => openTab(t.tab), title: 'Klang bearbeiten' },
        t.name, t.sub ? el('small', { text: rumbleOn ? t.sub : 'aus, im Tab „Rumble“ aufdrehen' }) : null),
      el('button', { class: 'ms mute' + (m.mute ? ' on' : ''), 'aria-pressed': m.mute ? 'true' : 'false', title: 'Stumm', text: 'M',
        onclick: () => { m.mute = !m.mute; eng && eng.update(); markDirty(); renderGrid(); } }),
      el('button', { class: 'ms solo' + (m.solo ? ' on' : ''), 'aria-pressed': m.solo ? 'true' : 'false', title: 'Solo', text: 'S',
        onclick: () => { m.solo = !m.solo; eng && eng.update(); markDirty(); renderGrid(); } }),
      el('input', { type: 'range', min: 0, max: 1, step: 0.01, value: m.vol, 'aria-label': t.name + ' Lautstärke',
        oninput: e => { m.vol = +e.target.value; eng && eng.update(); markDirty(); } })
    );
    const steps = el('div', { class: 'steps' });
    for (let i = 0; i < 16; i++) {
      let cls = 'step' + (i % 4 === 0 ? ' beat' : ''), label = null;
      if (t.type === 'drum') { const v = P[t.id][i]; if (v === 1) cls += ' on'; if (v === 2) cls += ' acc'; }
      else if (t.type === 'mel') {
        const n = P[t.id][i];
        if (n) { cls += ' on'; label = el('span', { text: noteLabel(degMidi(idea, n.d, baseFor(idea, t.id))).replace(/-?\d+$/, '') }); }
      } else if (P.kick[i] && rumbleOn) cls += ' ghost';
      const btn = el('button', { class: cls, 'aria-label': `${t.name} Step ${i + 1}`, onclick: () => stepClick(t, i) }, label);
      if (t.type === 'bus') { btn.disabled = true; btn.setAttribute('aria-hidden', 'true'); btn.tabIndex = -1; }

  }

}

function hasContent(id, entries) {
  if (id === 'fx') return entries.some(e => e.sec && ((e.first && e.sec.crash) || e.riserStart));
  if (id === 'rumble') return idea.sound.rumble.send > 0.01 && hasContent('kick', entries);
  if (id === 'clap' && entries.some(e => e.sec && e.sec.roll && e.last)) return true;
  return entries.some(e => !(e.sec && e.sec.off[id]) && idea.patterns[e.pat][id].some(v => v));
}

async function renderEntries(entries, { stem = null, loop = false } = {}) {

  } else for (let c = 0; c < chunks; c++) sched(c);
  const buf = await ctx.startRendering();
  if (!loop) return { sr, ch: [buf.getChannelData(0), buf.getChannelData(1)] };
  const n = Math.round(entries.length * barDur * sr);
  return { sr, ch: [buf.getChannelData(0).slice(n, 2 * n), buf.getChannelData(1).slice(n, 2 * n)] };
}

function midiFile(name, notes, bpm) {
  // notes: [{tick, dur, note, vel, ch}]
  const ev = [];
  for (const n of notes) {
    ev.push({ t: n.tick, d: [0x90 | n.ch, n.note, n.vel] });
    ev.push({ t: n.tick + n.dur, d: [0x80 | n.ch, n.note, 0] });

    0x00, 0xFF, 0x51, 0x03, (tempo >> 16) & 255, (tempo >> 8) & 255, tempo & 255,
    0x00, 0xFF, 0x58, 0x04, 0x04, 0x02, 0x18, 0x08];

  for (const e of ev) { body.push(...vlq(e.t - last), ...e.d); last = e.t; }

  const map = { kick: 36, clap: 39, hat: 42, ohat: 46 };
  const S = idea.sound, sd = stepDur();
  const dur = { bass: Math.max(30, Math.min(480, Math.round(S.bass.decay / sd * T))), lead: Math.max(30, Math.round(S.lead.gate * T)), pluck: Math.max(30, Math.round(S.pluck.gate * T)) };

    if (sec && sec.gap && en.last) off = Object.assign({}, off, GAP_OFF);
    for (let st = 0; st < 16; st++) {
      const tick = (b * 16 + st) * T + swingT(st);

      }
      if (p.pluck[st] && !off.pluck) out.pluck.push({ tick, dur: dur.pluck, note: degMidi(idea, p.pluck[st].d, baseFor(idea, 'pluck')), vel: 100, ch: 2 });

}

async function offerFile(filename, blob) {

    if (!dl) { toast('Download ist in dieser Ansicht nicht verfügbar. Öffne den Skizzenblock in claude.ai oder lokal.'); return false; }
    try { await dl.save({ filename, data: blob }); toast('Export gespeichert'); return true; }
    catch (e) {
      if (e && e.code === 'declined') toast('Export abgebrochen');
      else if (e && e.code === 'rate_limited') toast('Es ist schon ein Speichern-Dialog offen');
      else toast('Export nicht möglich: ' + ((e && e.message) || 'unbekannter Fehler'));
      return false;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  toast('Export gespeichert');

}

      let n = 1;
      for (const id of ids) {
        prog(`Rendere Einzelspur ${n} von ${ids.length}: ${CH_NAMES[id]} …`);
        files.push({ name: `${base}/Stems/${String(n++).padStart(2, '0')} ${CH_NAMES[id]}.wav`, data: encodeWav(await renderEntries(entries, { stem: id, loop })) });
      }
    }
    if (wMidi) {
      const m = buildMidi(entries);
      for (const [k, name] of [['drums', 'Drums'], ['bass', 'Bass'], ['lead', 'Lead'], ['pluck', 'Pluck']])
        if (m[k].length) files.push({ name: `${base}/MIDI/${name}.mid`, data: midiFile(name, m[k], idea.bpm) });
    }
    const enc = new TextEncoder();
    files.push({ name: `${base}/idee.json`, data: enc.encode(JSON.stringify(idea, null, 2)) });
    let bar = 1;
    const plan = loop ? [] : ['', 'Arrangement (Takt: Abschnitt, Patterns, Länge):',
      ...idea.song.map(x => { const line = `${String(bar).padStart(3, ' ')}: ${x.name} | ${x.seq} | ${x.bars} Takte` + (Object.keys(x.off).length ? ' | ohne ' + Object.keys(x.off).map(k => CH_NAMES[k]).join(', ') : ''); bar += x.bars; return line; })];
    files.push({ name: `${base}/LIESMICH.txt`, data: enc.encode([
      `Rave-Skizzenblock Export: ${idea.name} (${what})`,
      `Tempo: ${idea.bpm} BPM | Tonart: ${keyLabel(idea)} | Länge: ${entries.length} Takte (${fmtTime(secs)} min)`,
      '',
      'In Ableton:',
      `1. Projekt-Tempo auf ${idea.bpm} BPM stellen.`,
      '2. MIDI-Dateien auf MIDI-Spuren ziehen. Drums.mid passt auf ein Drum Rack (Kick C1, Clap D#1, Hi-Hat F#1, Open Hat A#1).',
      '3. Mix.wav als Referenzspur dazulegen, Einzelspuren bei Bedarf als Audio.',
      '4. Sounds in Ableton nachbauen oder layern, mischen, mastern.',
      ...plan,
      '',
      'Notizen:',
      idea.notes || '(keine)'
    ].join('\r\n')) });
    prog('Packe ZIP …');
    const blob = makeZip(files);
    prog('');
    await offerFile(base + '.zip', blob);
  } catch (e) {
    console.error(e); prog(''); toast('Export fehlgeschlagen: ' + (e.message || e));
  } finally {
    exporting = false; const b = $('#exBtn'); if (b) b.disabled = false;
  }
}

/* ---------- Ideen-Liste ---------- */
function ago(ts) {
  if (!ts) return '';
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return 'gerade eben';
  if (s < 3600) return `vor ${Math.round(s / 60)} Min.`;
  if (s < 86400) return `vor ${Math.round(s / 3600)} Std.`;
  return new Date(ts).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
}
function renderIdeas() {
  const ul = $('#ideaList'); if (!ul || !idea) return;
  ul.textContent = '';
  const list = Store.list.slice();
  if (!list.length) {
    ul.append(el('li', {}, el('p', { class: 'empty-note', text: 'Noch nichts gespeichert. Sobald du etwas änderst, landet die Idee hier.' })));
  }
  for (const it of list) {
    const cur = it.id === idea.id;
    ul.append(el('li', {}, el('button', {
      class: cur ? 'cur' : '', 'aria-current': cur ? 'true' : null,
      onclick: () => { if (cur) return; try { loadIdea(JSON.parse(it.json)); } catch (e) { toast('Diese Idee lässt sich nicht öffnen'); } }
    }, el('span', { class: 'n', text: cur ? idea.name : it.name }), el('span', { class: 'm', text: `${it.bpm} BPM · ${it.key} · ${ago(it.updated)}` }))));
  }
}

/* ---------- Ereignisse ---------- */
function wire() {
  for (let i = 0; i < 12; i++) $('#root').append(el('option', { value: i, text: NOTE_NAMES[i] }));
  for (const [k, s] of Object.entries(SCALES)) $('#scale').append(el('option', { value: k, text: s.name }));
  $('#playBtn').addEventListener('click', togglePlay);
  $('#navPlay').addEventListener('click', togglePlay);
  document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => navTo(b.dataset.nav)));
  $('#moreBtn').addEventListener('click', e => {
    const open = $('#transport').classList.toggle('open');
    e.currentTarget.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  const setBpm = raw => {
    const v = Math.min(200, Math.max(100, Math.round(+raw || idea.bpm)));
    idea.bpm = v; $('#bpm').value = v; $('#bpmChip').textContent = v; eng && eng.update(); markDirty();
    if (panelTab === 'song') renderPanel();
  };
  $('#bpm').addEventListener('change', e => setBpm(e.target.value));
  $('#bpmDown').addEventListener('click', () => setBpm(idea.bpm - 1));
  $('#bpmUp').addEventListener('click', () => setBpm(idea.bpm + 1));
  // Im Hintergrund hält der Browser den Takt nicht: sauber stoppen statt stottern
  document.addEventListener('visibilitychange', () => { if (document.hidden && play.on) stopPlay(); });
  $('#swing').addEventListener('input', e => { idea.swing = +e.target.value; $('#swingOut').textContent = idea.swing + ' %'; markDirty(); });
  $('#root').addEventListener('change', e => { idea.root = +e.target.value; markDirty(); renderGrid(); renderPanel(); });
  $('#scale').addEventListener('change', e => { idea.scale = e.target.value; markDirty(); renderGrid(); renderPanel(); });
  document.querySelectorAll('#modeSeg button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  $('#copyTo').addEventListener('change', e => {
    const k = e.target.value; if (!k) return;
    idea.patterns[k] = clone(idea.patterns[editPat]);
    markDirty(); toast(`Pattern ${editPat} nach ${k} kopiert`); renderTransport();
  });
  let clearArm = 0;
  $('#clearBtn').addEventListener('click', e => {
    const b = e.currentTarget;
    if (!clearArm) { b.textContent = 'Wirklich leeren?'; b.classList.add('warn'); clearArm = setTimeout(() => { clearArm = 0; b.textContent = 'Leeren'; b.classList.remove('warn'); }, 3000); return; }
    clearTimeout(clearArm); clearArm = 0; b.textContent = 'Leeren'; b.classList.remove('warn');
    idea.patterns[editPat] = emptyPattern(); markDirty(); renderGrid(); renderTransport(); if (MELS.includes(panelTab)) renderPanel();
  });
  $('#ideaName').addEventListener('input', e => { idea.name = e.target.value || 'Ohne Titel'; markDirty(); renderIdeas(); });
  $('#notes').addEventListener('input', e => { idea.notes = e.target.value; markDirty(); });
  document.querySelectorAll('[data-tpl]').forEach(b => b.addEventListener('click', () => newFromTemplate(b.dataset.tpl)));
  $('#dupBtn').addEventListener('click', () => {
    const I = clone(idea); I.id = uid(); I.name = (idea.name + ' (Kopie)').slice(0, 60);
    loadIdea(I); markDirty(); toast('Kopie angelegt');
  });
  let delArm = 0;
  $('#delBtn').addEventListener('click', e => {
    const b = e.currentTarget;
    if (!delArm) { b.textContent = 'Wirklich löschen?'; b.classList.add('warn'); delArm = setTimeout(() => { delArm = 0; b.textContent = 'Löschen'; b.classList.remove('warn'); }, 3000); return; }
    clearTimeout(delArm); delArm = 0; b.textContent = 'Löschen'; b.classList.remove('warn');
    const id = idea.id; clearTimeout(saveTimer);
    saveChain = saveChain.then(() => Store.remove(id)).catch(err => toast('Löschen fehlgeschlagen: ' + (err.message || err)));
    LS.del('rsb:draft');
    const next = Store.list.find(x => x.id !== id);
    if (next) { try { loadIdea(JSON.parse(next.json)); } catch (_) { loadIdea(TEMPLATES.blank(), { draft: true }); } }
    else loadIdea(generateBounce(7), { draft: true });
    toast('Idee gelöscht');
  });
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space' || e.repeat) return;
    const t = e.target;
    if (t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && /^(text|number|search)$/.test(t.type)) || t.isContentEditable)) return;
    e.preventDefault(); togglePlay();
  });
}

/* ---------- Start ---------- */
wire();
{ const v = LS.get('rsb:view'); if (v === 'beat' || v === 'sound' || v === 'ideas') setView(v); }
if (LS.get('rsb:mode') === 'song') playMode = 'song';
Store.initLocal();
(function boot() {
  let draft = null;
  try { draft = JSON.parse(LS.get('rsb:draft') || 'null'); } catch (e) { draft = null; }
  if (draft && draft.id) loadIdea(draft);
  else loadIdea(generateBounce(7), { draft: true });
})();
Store.initCloud();
})();
</script>
