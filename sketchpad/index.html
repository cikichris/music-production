<title>Rave-Skizzenblock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Hardware-Rack. Transport oben, Ideen-Liste links, Step-Raster und Klang-Panel rechts.
   Bewusst nur ein (dunkles) Theme: Club-Licht, UV-Violett für aktive Steps, Amber für Akzente und Playhead. */
:root{
  --bg:#0e0d13;
  --panel:#16141d;
  --raise:#1f1c29;
  --raise-2:#282436;
  --line:#2e2a3c;
  --fg:#ece8f4;
  --muted:#958eab;
  --uv:#9f7eff;
  --uv-ink:#140d2b;
  --uv-soft:#3b3070;
  --amber:#ffb547;
  --amber-ink:#2a1a00;
  --danger:#ff5d73;
  --ok:#5fd4a0;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
label,.h,.legend,.brand{-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.app{max-width:1440px;margin:0 auto;padding-block:16px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}

/* Kopfzeile */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand b{color:var(--uv);font-weight:800}
.idea-name{flex:1 1 220px;min-width:0;background:transparent;border:1px solid transparent;border-radius:6px;
  padding:6px 8px;font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.01em}
@media (hover:hover){.idea-name:hover{border-color:var(--line)}}
.idea-name:focus{border-color:var(--uv);outline:none;background:var(--panel)}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill[data-s="saved"]::before{background:var(--ok)}
.pill[data-s="saving"]::before{background:var(--amber)}
.pill[data-s="error"]::before{background:var(--danger)}

/* Transport */
.transport{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:9;box-shadow:0 10px 24px -12px var(--bg)}
.t-more{display:contents}
.t-more-btn{display:none}
.stepb{width:34px;padding:0;font-size:17px;line-height:1}
.play{font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--uv);color:var(--uv-ink);border:0;border-radius:8px;padding:12px 18px;min-width:108px;cursor:pointer}
.play[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink)}
.field{display:flex;flex-direction:column;gap:3px}
.field>span{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.field input[type=number],.field select,.select{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 8px;height:34px}
.field input[type=number]{width:62px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.field input[type=number]::-webkit-inner-spin-button,.field input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.inline{display:flex;gap:6px;align-items:center}
.swing{width:110px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pats{display:flex;gap:4px}
.pat{width:38px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--raise);font-family:var(--f-display);font-weight:600;cursor:pointer;position:relative}
.pat.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pat.empty:not(.sel){color:var(--muted)}
.pat.playing::after{content:"";position:absolute;left:50%;bottom:-6px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--amber)}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:0 12px;height:34px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
@media (hover:hover){.btn:hover{background:var(--raise-2)}}
.btn.on{background:var(--uv);border-color:var(--uv);color:var(--uv-ink)}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn:disabled{opacity:.5;cursor:default}
.meter{display:flex;align-items:center;gap:8px;margin-left:auto}
.meter canvas{width:140px;height:14px;border-radius:3px;background:var(--raise);display:block}
.meter output{font-size:12px;color:var(--muted);width:56px;text-align:right}

/* Hauptbereich */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.ideas{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.h{font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.newrow{display:flex;flex-wrap:wrap;gap:6px}
.newrow .btn{flex:1 1 auto;padding:0 8px;font-size:12px}
.ilist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:340px;overflow:auto}
.ilist button{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:7px 9px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
@media (hover:hover){.ilist button:hover{background:var(--raise)}}
.ilist button.cur{background:var(--raise);border-color:var(--uv-soft)}
.ilist .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ilist .m{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.empty-note{font-size:12.5px;color:var(--muted);margin:0}
.ideas textarea{width:100%;min-height:96px;resize:vertical;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:13px}
.ideas .acts{display:flex;gap:6px}
.ideas .acts .btn{flex:1}

.rack{display:flex;flex-direction:column;gap:14px;min-width:0}
.gridbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.gridtools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.row{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;align-items:center}
.head{display:grid;grid-template-columns:1fr auto auto;grid-template-rows:auto auto;gap:3px 4px;align-items:center}
.tname{grid-column:1;text-align:left;background:none;border:0;padding:2px 0;font-weight:700;font-size:13.5px;cursor:pointer}
.tname.sel{color:var(--uv)}
.tname small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.ms{width:26px;height:24px;border-radius:5px;border:1px solid var(--line);background:var(--raise);font-size:11px;font-weight:700;cursor:pointer;color:var(--muted)}
.ms.mute.on{background:var(--danger);border-color:var(--danger);color:#2b0710}
.ms.solo.on{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.head input[type=range]{grid-column:1 / -1;height:16px}
.steps{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px}
.step{height:38px;border-radius:5px;border:1px solid var(--line);background:var(--raise);cursor:pointer;padding:0;position:relative;
  font-family:var(--f-mono);font-size:10px;color:var(--uv-ink);overflow:hidden;transition:background-color .06s}
.step.beat{background:var(--raise-2)}
.step:nth-child(4n+1):not(:first-child){margin-left:6px}
.step.on{background:var(--uv);border-color:var(--uv)}
.step.acc{background:var(--amber);border-color:var(--amber)}
.step.acc::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--amber-ink);opacity:.35}
.step.ghost{background:var(--uv-soft);border-color:var(--uv-soft)}
.step:disabled{cursor:default}
.step.ph{box-shadow:0 0 0 2px var(--fg) inset}
.step:active:not(:disabled),.rc:active{transform:scale(.93)}
.step span{font-weight:600;font-size:10px;letter-spacing:-.02em}
.row.bus .step{height:16px}

/* Klang-Panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;padding:0 6px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:11px 12px 9px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--uv)}
.pbody{padding:16px;display:flex;flex-direction:column;gap:16px}
.hint{font-size:12.5px;color:var(--muted);margin:0;max-width:70ch}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px 22px}
.param{display:flex;flex-direction:column;gap:2px;min-width:0}
.param .lab{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.param .lab output{color:var(--fg);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.param select{background:var(--raise);border:1px solid var(--line);border-radius:6px;height:32px;padding:0 8px}
.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--uv)}
.group{display:flex;flex-direction:column;gap:10px}
.group+.group{border-top:1px solid var(--line);padding-top:14px}

.select,.param select{-webkit-appearance:none;appearance:none;padding-right:28px;background-repeat:no-repeat;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:var(--fg);border:3px solid var(--uv)}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--fg);border:3px solid var(--uv)}

.roll-wrap{overflow-x:auto}
.roll{display:grid;grid-template-columns:44px repeat(16,minmax(22px,1fr));gap:2px;min-width:480px}
.rlab{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);display:flex;align-items:center;padding-left:2px}
.rlab.root{color:var(--fg);font-weight:600}
.rc{height:20px;border:0;border-radius:3px;background:var(--raise);cursor:pointer;padding:0}
.rc.beat{background:var(--raise-2)}
.rc.root{box-shadow:0 1px 0 var(--uv-soft) inset}
.rc:nth-child(17n+6),.rc:nth-child(17n+10),.rc:nth-child(17n+14){margin-left:4px}
.rc.on{background:var(--uv)}
.rc.ph{outline:1px solid var(--fg);outline-offset:-1px}

.export{display:flex;flex-direction:column;gap:14px}
.exopts{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:end}
.exlist{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:3px;max-width:75ch}
.exlist b{color:var(--fg);font-weight:600}
.progress{font-family:var(--f-mono);font-size:12px;color:var(--amber);min-height:1.2em}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);
  padding:9px 14px;border-radius:8px;font-weight:600;font-size:13px;max-width:calc(100% - 32px);z-index:20}

/* Untere Leiste (nur Handy) */
.nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:15;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;
  background:var(--panel);background:color-mix(in srgb,var(--panel) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{background:none;border:0;cursor:pointer;padding:0}
.nitem{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;color:var(--muted);font-size:11px;font-weight:600}
.nitem svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nitem[aria-current="page"]{color:var(--fg)}
.nitem[aria-current="page"] svg{stroke:var(--uv)}
.nav .nplay{justify-self:center;width:66px;height:66px;border-radius:50%;background:var(--uv);color:var(--uv-ink);margin-top:-24px;
  box-shadow:0 0 0 5px var(--bg),0 8px 22px rgba(0,0,0,.5);display:grid;place-items:center}
.nav .nplay[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink)}
.nplay svg{width:26px;height:26px;fill:currentColor}
.nplay .i-stop,.nplay[aria-pressed="true"] .i-play{display:none}
.nplay[aria-pressed="true"] .i-stop{display:block}

@media (pointer: coarse){
  .kbd-hint{display:none}
  input,select,textarea,.ideas textarea{font-size:16px}  /* iOS zoomt sonst beim Antippen */
  input[type=range]{height:40px}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px}
  input[type=range]::-webkit-slider-thumb{width:28px;height:28px;margin-top:-11px}
  .head input[type=range]{height:36px}
  .check{min-height:44px}
  .check input{width:22px;height:22px}
}
@media (max-width: 960px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .ideas{order:2}
  .meter{margin-left:0}
}
@media (max-width: 760px){
  .app{gap:10px;padding-block:10px 112px}
  .brand{display:none}
  .top{flex-wrap:nowrap;gap:8px}
  .idea-name{flex:1 1 0;font-size:17px;padding:6px 4px}
  .pill{padding:9px}
  .pill .pt{display:none}
  .transport{padding:8px;gap:8px;border-radius:12px}
  .play.t-desk{display:none}
  .t-pat{flex:1 1 auto;min-width:0}
  .t-pat>span:first-child{display:none}
  .pats{flex:1;gap:5px}
  .pat{flex:1;width:auto;min-width:34px;height:44px;font-size:15px}
  .btn{height:44px;padding:0 13px;font-size:14px}
  .stepb{width:44px;padding:0;font-size:20px}
  .t-more-btn{display:inline-flex;align-items:center;gap:5px;padding:0 10px}
  .t-more{display:none}
  .transport.open .t-more{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 16px;width:100%;padding:10px 4px 4px;border-top:1px solid var(--line)}
  .t-more .wide{grid-column:1 / -1}
  .t-more .inline{flex-wrap:wrap}
  .swing{width:100%}
  .field select,.select,.field input[type=number]{height:44px}
  .t-more .select{flex:1}
  .meter canvas{flex:1;width:auto;min-width:0}
  .layout{display:block}
  .ideas,.gridbox,.panel{display:none}
  .app[data-view="beat"] .gridbox{display:flex}
  .app[data-view="sound"] .panel{display:block}
  .app[data-view="ideas"] .ideas{display:flex}
  .gridbox{padding:10px 12px 4px;gap:0}
  .gridtools{padding-bottom:8px}
  .row{grid-template-columns:minmax(0,1fr);gap:6px;padding-block:10px;border-top:1px solid var(--line)}
  .head{display:flex;gap:8px}
  .tname{flex:0 0 96px;font-size:15px;padding:8px 0}
  .tname::after{content:" ›";color:var(--muted);font-weight:400}
  .tname small{display:none}
  .head input[type=range]{flex:1;order:1;min-width:0}
  .ms{order:2;width:40px;height:38px;font-size:13px}
  .steps{grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
  .step{height:46px;border-radius:7px}
  .step span{font-size:12px}
  .step:nth-child(4n+1):not(:first-child){margin-left:0}
  .step:nth-child(8n+5){margin-left:6px}
  .row.bus .steps{display:none}
  .tab{padding:14px 14px 12px;font-size:14px}
  .tab[data-id="export"]{display:none}
  .app[data-export] .tabs{display:none}
  .pbody{padding:14px 12px}
  .params{grid-template-columns:minmax(0,1fr);gap:10px}
  .param .lab{font-size:13px}
  .param select{height:44px}
  .roll{grid-template-columns:46px repeat(16,34px);min-width:0;width:max-content;gap:3px}
  .rlab{position:sticky;left:0;z-index:1;background:var(--panel);font-size:11.5px}
  .rc{height:32px;border-radius:5px}
  .exopts{flex-direction:column;align-items:stretch;gap:6px}
  .exopts .btn{height:52px;font-size:15px;margin-top:6px}
  .ilist{max-height:none}
  .ilist button{padding:12px 10px}
  .newrow .btn{font-size:14px;padding:0 10px}
  .toast{bottom:calc(98px + env(safe-area-inset-bottom,0px))}
  .nav{display:grid}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app" data-view="beat">
  <header class="top">
    <div class="brand">Rave<b>·</b>Skizzenblock</div>
    <input id="ideaName" class="idea-name" aria-label="Name der Idee" maxlength="60">
    <span id="saveState" class="pill" data-s="idle" role="status"><span class="pt" id="saveText">Lokal</span></span>
  </header>

  <section class="transport" id="transport" aria-label="Transport">
    <button id="playBtn" class="play t-desk" aria-pressed="false">Play</button>
    <div class="field t-pat"><span>Pattern</span>
      <span class="inline">
        <span class="pats" id="pats"></span>
        <button id="chainBtn" class="btn" aria-pressed="false" title="Spielt alle gefüllten Patterns nacheinander">Kette</button>
      </span>
    </div>
    <button id="moreBtn" class="btn t-more-btn" aria-expanded="false" aria-controls="tMore"><span id="bpmChip" class="mono">150</span><span>BPM</span><span aria-hidden="true">▾</span></button>
    <div class="t-more" id="tMore">
      <div class="field"><span>Tempo (BPM)</span>
        <span class="inline">
          <button class="btn stepb" id="bpmDown" aria-label="Tempo langsamer">−</button>
          <input id="bpm" type="number" inputmode="numeric" min="100" max="200" step="1" aria-label="Tempo in BPM">
          <button class="btn stepb" id="bpmUp" aria-label="Tempo schneller">+</button>
        </span>
      </div>
      <label class="field"><span>Swing <output id="swingOut" class="mono">0 %</output></span>
        <input id="swing" class="swing" type="range" min="0" max="40" step="1">
      </label>
      <div class="field wide"><span>Tonart</span>
        <span class="inline">
          <select id="root" class="select" aria-label="Grundton"></select>
          <select id="scale" class="select" aria-label="Tonleiter"></select>
        </span>
      </div>
      <div class="field wide"><span>Pattern bearbeiten</span>
        <span class="inline">
          <select id="copyTo" class="select" aria-label="Pattern kopieren nach"></select>
          <button id="clearBtn" class="btn">Leeren</button>
        </span>
      </div>
      <div class="meter wide" aria-label="Pegel Master">
        <canvas id="meter" width="280" height="28"></canvas>
        <output id="meterOut" class="mono">–∞ dB</output>
      </div>
    </div>
  </section>

  <main class="layout">
    <aside class="ideas" aria-label="Ideen">
      <h2 class="h">Neue Idee</h2>
      <div class="newrow">

<script>

  { id: 'rumble', name: 'Rumble',   type: 'bus',  tab: 'rumble', sub: 'folgt der Kick' },

}

    patterns: { A: emptyPattern(), B: emptyPattern(), C: emptyPattern(), D: emptyPattern() },

const TEMPLATES = {
  hardbounce() {

      notes: 'Bouncy Offbeat-Bass mit Oktavsprung, Supersaw-Stabs im 3-3-2-Rhythmus.\nAkkorde: Am – F – Em | Dm – C – Em' });

  },
  hardtechno() {
    const I = baseIdea();

    Object.assign(I.sound.kick, { start: 380, end: 48, pdecay: 0.06, decay: 0.55, click: 0.25, drive: 0.82, tone: 4500 });

  blank() {
    const I = baseIdea();

function merge(def, val) {

  I.bpm = Math.min(200, Math.max(100, Math.round(I.bpm)));

/* ---------- Audio-Engine (Echtzeit und Offline-Render) ---------- */

    }
  }

}

// iPhone: Ton auch bei aktivem Lautlos-Schalter
let silentEl = null;
function unlockIOS() {
  try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch (e) {}
  const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!iOS || silentEl) return;
  try {
    const n = 4000, buf = new ArrayBuffer(44 + n), dv = new DataView(buf);
    const str = (o, t) => { for (let i = 0; i < t.length; i++) dv.setUint8(o + i, t.charCodeAt(i)); };
    str(0, 'RIFF'); dv.setUint32(4, 36 + n, true); str(8, 'WAVEfmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, 8000, true); dv.setUint32(28, 8000, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true); str(36, 'data'); dv.setUint32(40, n, true);
    new Uint8Array(buf, 44).fill(128);
    silentEl = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
    silentEl.loop = true; silentEl.setAttribute('playsinline', '');
    const pr = silentEl.play(); if (pr && pr.catch) pr.catch(() => {});
  } catch (e) {}
}
function ensureAudio() {
  unlockIOS();
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC({ latencyHint: 'interactive' });
    eng = buildEngine(actx, () => idea, {});

    requestAnimationFrame(frame);
  }
  if (actx.state !== 'running') { const pr = actx.resume(); if (pr && pr.catch) pr.catch(() => {}); }
}
const stepDur = () => 60 / idea.bpm / 4;
const swingOff = (step, sd) => (step % 2 === 1 ? (idea.swing / 100) * sd * 0.66 : 0);

function tick() {
  const sd = stepDur();
  while (play.next < actx.currentTime + 0.12) {
    const t = play.next + swingOff(play.step, sd);
    eng.trigger(idea.patterns[play.pat], play.step, t, sd);
    uiQueue.push({ t, step: play.step, pat: play.pat });
    play.next += sd;
    play.step++;
    if (play.step === 16) {
      play.step = 0;
      if (idea.chain) { const s = seqList(); play.seqIdx = (play.seqIdx + 1) % s.length; play.pat = s[play.seqIdx]; }
      else play.pat = editPat;
    }
  }
}
function startPlay() {

    LS.set('rsb:soundHint', '1'); toast('Kein Ton? Lautstärke hoch und Lautlos-Schalter aus.');
  }
  eng.update();
  play.on = true; play.step = 0; play.seqIdx = 0;
  play.pat = idea.chain ? seqList()[0] : editPat;

}

function audition(only, deg) {

  ensureAudio(); eng.update();
  const p = emptyPattern();
  if (only === 'bass' || only === 'lead') p[only][0] = { d: deg ?? lastDeg[only] ?? 0 };
  else if (only === 'rumble') p.kick[0] = 1;

}

/* Pegelanzeige und Playhead */
let meterBuf = null, peakHold = 0, meterCol = null;
function frame() {
  requestAnimationFrame(frame);
  if (!actx) return;
  const now = actx.currentTime;
  let cur = null;
  while (uiQueue.length && uiQueue[0].t <= now) cur = uiQueue.shift();
  if (cur && play.on) setPlayhead(cur.step, cur.pat);
  const an = eng.analyser; if (!an) return;
  if (!meterBuf) meterBuf = new Float32Array(an.fftSize);
  an.getFloatTimeDomainData(meterBuf);
  let pk = 0; for (let i = 0; i < meterBuf.length; i++) { const a = Math.abs(meterBuf[i]); if (a > pk) pk = a; }
  peakHold = Math.max(pk, peakHold * 0.94);
  const cv = $('#meter'); if (!cv.offsetParent) return;
  const c = cv.getContext('2d'), w = cv.width, h = cv.height;
  const db = 20 * Math.log10(peakHold + 1e-9), x = Math.max(0, Math.min(1, (db + 48) / 48));
  c.clearRect(0, 0, w, h);
  if (!meterCol) { const css = getComputedStyle(document.documentElement); meterCol = ['--danger', '--amber', '--uv'].map(v => css.getPropertyValue(v).trim()); }
  c.fillStyle = db > -1 ? meterCol[0] : db > -6 ? meterCol[1] : meterCol[2];
  c.fillRect(0, 0, w * x, h);
  $('#meterOut').textContent = (db < -60 ? '–∞' : db.toFixed(1)) + ' dB';
}

const Store = {
  db: null, cloud: false, list: [],

    let idx = [];

    this.list = idx.filter(m => m && m.id && LS.get('rsb:idea:' + m.id)).map(m => ({ ...m, json: LS.get('rsb:idea:' + m.id) }));
  },
  writeLocalIndex() {

  },
  async initCloud() {
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    let db = null;
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) return;
    this.db = db;
    let first = true;
    db.collection('ideas').orderBy('updated', 'desc').onSnapshot(snap => {
      this.cloud = true;
      this.list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (first) {
        first = false;
        // Auf einem neuen Gerät: zuletzt bearbeitete Idee statt Beispiel öffnen
        if (isDraftTemplate && this.list.length) { try { loadIdea(JSON.parse(this.list[0].json)); } catch (e) {} }
      }
      renderIdeas(); setSaveState(saveState);
    }, err => {
      console.warn('db', err); this.cloud = false; this.db = null; setSaveState('error', 'Cloud-Speicher nicht erreichbar, speichere lokal');
    });
  },
  async save(I) {
    const rec = { name: I.name, updated: I.updated, bpm: I.bpm, key: keyLabel(I), json: JSON.stringify(I) };
    LS.set('rsb:last', I.id);
    LS.set('rsb:draft', rec.json);
    if (this.db) { await this.db.collection('ideas').doc(I.id).set(rec); return; }
    LS.set('rsb:idea:' + I.id, rec.json);
    this.list = [{ id: I.id, ...rec }, ...this.list.filter(x => x.id !== I.id)].sort((a, b) => b.updated - a.updated);
    this.writeLocalIndex(); renderIdeas();
  },
  async remove(id) {
    LS.del('rsb:idea:' + id);
    if (this.db) { await this.db.collection('ideas').doc(id).delete(); return; }
    this.list = this.list.filter(x => x.id !== id); this.writeLocalIndex(); renderIdeas();
  }
};

function trackHasContent(id, seq) {
  const ps = seq.map(k => idea.patterns[k]);
  if (id === 'rumble') return idea.sound.rumble.send > 0.01 && ps.some(p => p.kick.some(v => v));
  if (id === 'bass' || id === 'lead') return ps.some(p => p[id].some(n => n));
  return ps.some(p => p[id].some(v => v));
}

async function renderAudio(bars, stem) {
  const sr = 48000, sd = stepDur(), seq = seqList();
  const loopSteps = bars * 16, total = loopSteps * 2;  // ein Durchlauf Vorlauf, damit Fahnen am Loop-Anfang stimmen
  const len = Math.ceil((total * sd + 0.01) * sr);
  const ctx = new OfflineAudioContext(2, len, sr);
  const e = buildEngine(ctx, () => idea, { offline: true, stem });
  e.update();
  for (let i = 0; i < total; i++) {
    const bar = Math.floor(i / 16), st = i % 16;
    e.trigger(idea.patterns[seq[bar % seq.length]], st, i * sd + swingOff(st, sd), sd);
  }
  const buf = await ctx.startRendering();
  const start = Math.round(loopSteps * sd * sr), n = Math.round(loopSteps * sd * sr);
  return { sr, ch: [buf.getChannelData(0).slice(start, start + n), buf.getChannelData(1).slice(start, start + n)] };
}

function encodeWav({ sr, ch }) {
  const n = ch[0].length, nc = ch.length, bps = 3, dataLen = n * nc * bps;
  const buf = new ArrayBuffer(44 + dataLen), dv = new DataView(buf), u8 = new Uint8Array(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); dv.setUint32(4, 36 + dataLen, true); str(8, 'WAVE');
  str(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, nc, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * nc * bps, true); dv.setUint16(32, nc * bps, true); dv.setUint16(34, 24, true);
  str(36, 'data'); dv.setUint32(40, dataLen, true);
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < nc; c++) {
    let v = Math.max(-1, Math.min(1, ch[c][i]));
    let x = Math.round(v * 8388607); if (x < 0) x += 0x1000000;
    u8[o++] = x & 255; u8[o++] = (x >> 8) & 255; u8[o++] = (x >> 16) & 255;

}

function midiFile(name, notes, bpm) {
  // notes: [{tick, dur, note, vel, ch}]
  const ev = [];
  for (const n of notes) {
    ev.push({ t: n.tick, d: [0x90 | n.ch, n.note, n.vel] });
    ev.push({ t: n.tick + n.dur, d: [0x80 | n.ch, n.note, 0] });
  }
  ev.sort((a, b) => a.t - b.t || ((a.d[0] & 0xF0) === 0x80 ? -1 : 1));
  const vlq = v => { const out = [v & 0x7F]; while ((v >>= 7)) out.unshift((v & 0x7F) | 0x80); return out; };
  const enc = new TextEncoder().encode(name);
  const tempo = Math.round(60000000 / bpm);
  const body = [0x00, 0xFF, 0x03, ...vlq(enc.length), ...enc,
    0x00, 0xFF, 0x51, 0x03, (tempo >> 16) & 255, (tempo >> 8) & 255, tempo & 255,
    0x00, 0xFF, 0x58, 0x04, 0x04, 0x02, 0x18, 0x08];
  let last = 0;
  for (const e of ev) { body.push(...vlq(e.t - last), ...e.d); last = e.t; }
  body.push(0x00, 0xFF, 0x2F, 0x00);
  const head = [0x4D,0x54,0x68,0x64, 0,0,0,6, 0,0, 0,1, 0x01,0xE0];
  const tl = body.length;
  return new Uint8Array([...head, 0x4D,0x54,0x72,0x6B, (tl >>> 24) & 255, (tl >> 16) & 255, (tl >> 8) & 255, tl & 255, ...body]);
}
function buildMidi(bars) {
  const seq = seqList(), sd = stepDur(), T = 120;  // 480 PPQ, 120 Ticks pro 16tel
  const swingT = st => (st % 2 === 1 ? Math.round((idea.swing / 100) * 0.66 * T) : 0);
  const drums = [], bass = [], lead = [];
  const map = { kick: 36, clap: 39, hat: 42, ohat: 46 };
  const S = idea.sound;
  const bassDur = Math.max(30, Math.min(480, Math.round(S.bass.decay / sd * T)));
  const leadDur = Math.max(30, Math.round(S.lead.gate * T));
  for (let i = 0; i < bars * 16; i++) {
    const bar = Math.floor(i / 16), st = i % 16, p = idea.patterns[seq[bar % seq.length]], tick = i * T + swingT(st);
    for (const id of DRUMS) if (p[id][st]) drums.push({ tick, dur: 60, note: map[id], vel: p[id][st] === 2 ? 127 : 100, ch: 9 });
    if (p.bass[st]) bass.push({ tick, dur: bassDur, note: degMidi(idea, p.bass[st].d, baseFor(idea, 'bass')), vel: 105, ch: 0 });
    if (p.lead[st]) {
      const d = p.lead[st].d, ds = S.lead.chord ? [d, d + 2, d + 4] : [d];
      for (const x of ds) lead.push({ tick, dur: leadDur, note: degMidi(idea, x, baseFor(idea, 'lead')), vel: 100, ch: 1 });
    }
  }
  return { drums, bass, lead };
}

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name), data = f.data, crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0x0800, true); cd.setUint16(10, 0, true);
    cd.setUint16(12, dosTime, true); cd.setUint16(14, dosDate, true); cd.setUint32(16, crc, true);
    cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true); cd.setUint16(28, name.length, true);
    cd.setUint16(30, 0, true); cd.setUint16(32, 0, true); cd.setUint16(34, 0, true); cd.setUint16(36, 0, true);
    cd.setUint32(38, 0, true); cd.setUint32(42, offset, true);

  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

async function offerFile(filename, blob) {
  if (window.claude && typeof window.claude.use === 'function') {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (!dl) { toast('Download ist in dieser Ansicht nicht verfügbar. Öffne den Skizzenblock in claude.ai oder lokal.'); return false; }
    try { await dl.save({ filename, data: blob }); toast('Export gespeichert'); return true; }
    catch (e) {
      if (e && e.code === 'declined') toast('Export abgebrochen');
      else if (e && e.code === 'rate_limited') toast('Es ist schon ein Speichern-Dialog offen');
      else toast('Export nicht möglich: ' + ((e && e.message) || 'unbekannter Fehler'));
      return false;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  toast('Export gespeichert');
  return true;
}

const safe = s => (s || 'Idee').replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, ' ').trim().slice(0, 50) || 'Idee';
async function doExport() {
  if (exporting) return;
  const bars = +$('#exBars').value, wMix = $('#exMix').checked, wStems = $('#exStems').checked, wMidi = $('#exMidi').checked;
  if (!wMix && !wStems && !wMidi) { toast('Wähle mindestens eine Exportart'); return; }
  exporting = true; $('#exBtn').disabled = true;
  const prog = t => { const p = $('#exProg'); if (p) p.textContent = t; };
  try {
    const seq = seqList();
    const base = `${safe(idea.name)} ${idea.bpm}bpm ${NOTE_NAMES[idea.root]}${idea.scale === 'minor' || idea.scale === 'harmonic' ? 'm' : ' ' + SCALES[idea.scale].name}`;
    const files = [];
    if (wMix) { prog('Rendere Mix …'); files.push({ name: `${base}/${base} - Mix.wav`, data: encodeWav(await renderAudio(bars, null)) }); }
    if (wStems) {
      let n = 1;
      for (const t of TRACKS) {
        if (!trackHasContent(t.id, seq)) continue;
        prog(`Rendere Einzelspur ${t.name} …`);
        files.push({ name: `${base}/Stems/${String(n++).padStart(2, '0')} ${t.name}.wav`, data: encodeWav(await renderAudio(bars, t.id)) });
      }
    }
    if (wMidi) {
      const m = buildMidi(bars);
      if (m.drums.length) files.push({ name: `${base}/MIDI/Drums.mid`, data: midiFile('Drums', m.drums, idea.bpm) });
      if (m.bass.length) files.push({ name: `${base}/MIDI/Bass.mid`, data: midiFile('Bass', m.bass, idea.bpm) });
      if (m.lead.length) files.push({ name: `${base}/MIDI/Lead.mid`, data: midiFile('Lead', m.lead, idea.bpm) });
    }
    const enc = new TextEncoder();
    files.push({ name: `${base}/idee.json`, data: enc.encode(JSON.stringify(idea, null, 2)) });
    files.push({ name: `${base}/LIESMICH.txt`, data: enc.encode([
      `Rave-Skizzenblock Export: ${idea.name}`,
      `Tempo: ${idea.bpm} BPM | Tonart: ${keyLabel(idea)} | Länge: ${bars} Takt${bars > 1 ? 'e' : ''} | Patterns: ${seq.join(' > ')}`,
      '',
      'In Ableton:',
      `1. Projekt-Tempo auf ${idea.bpm} BPM stellen.`,
      '2. Die WAVs aus "Stems" in die Arrangement-Ansicht ziehen. Sie sind nahtlos loopbar.',
      '3. MIDI-Dateien auf MIDI-Spuren ziehen. Drums.mid passt auf ein Drum Rack (Kick C1, Clap D#1, Hi-Hat F#1, Open Hat A#1).',
      '4. Sounds in Ableton nachbauen oder layern, arrangieren, mischen, mastern.',
      '',
      'Notizen:',
      idea.notes || '(keine)'
    ].join('\r\n')) });
    prog('Packe ZIP …');
    const blob = makeZip(files);
    prog('');
    await offerFile(base + '.zip', blob);
  } catch (e) {
    console.error(e); prog(''); toast('Export fehlgeschlagen: ' + (e.message || e));
  } finally {
    exporting = false; const b = $('#exBtn'); if (b) b.disabled = false;
  }
}

function ago(ts) {
  if (!ts) return '';
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return 'gerade eben';
  if (s < 3600) return `vor ${Math.round(s / 60)} Min.`;
  if (s < 86400) return `vor ${Math.round(s / 3600)} Std.`;
  return new Date(ts).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
}

  });
  let clearArm = 0;
  $('#clearBtn').addEventListener('click', e => {
    const b = e.currentTarget;
    if (!clearArm) { b.textContent = 'Wirklich leeren?'; b.classList.add('warn'); clearArm = setTimeout(() => { clearArm = 0; b.textContent = 'Leeren'; b.classList.remove('warn'); }, 3000); return; }
    clearTimeout(clearArm); clearArm = 0; b.textContent = 'Leeren'; b.classList.remove('warn');
    idea.patterns[editPat] = emptyPattern(); markDirty(); renderGrid(); renderTransport(); if (panelTab === 'bass' || panelTab === 'lead') renderPanel();
  });
  $('#ideaName').addEventListener('input', e => { idea.name = e.target.value || 'Ohne Titel'; markDirty(); renderIdeas(); });
  $('#notes').addEventListener('input', e => { idea.notes = e.target.value; markDirty(); });
  document.querySelectorAll('[data-tpl]').forEach(b => b.addEventListener('click', () => newFromTemplate(b.dataset.tpl)));
  $('#dupBtn').addEventListener('click', () => {
    const I = clone(idea); I.id = uid(); I.name = (idea.name + ' (Kopie)').slice(0, 60);
    loadIdea(I); markDirty(); toast('Kopie angelegt');
  });
  let delArm = 0;
  $('#delBtn').addEventListener('click', e => {
    const b = e.currentTarget;
    if (!delArm) { b.textContent = 'Wirklich löschen?'; b.classList.add('warn'); delArm = setTimeout(() => { delArm = 0; b.textContent = 'Löschen'; b.classList.remove('warn'); }, 3000); return; }
    clearTimeout(delArm); delArm = 0; b.textContent = 'Löschen'; b.classList.remove('warn');
    const id = idea.id; clearTimeout(saveTimer);
    saveChain = saveChain.then(() => Store.remove(id)).catch(err => toast('Löschen fehlgeschlagen: ' + (err.message || err)));
    LS.del('rsb:draft');
    const next = Store.list.find(x => x.id !== id);
    if (next) { try { loadIdea(JSON.parse(next.json)); } catch (_) { loadIdea(TEMPLATES.blank(), { draft: true }); } }
    else loadIdea(TEMPLATES.hardbounce(), { draft: true });
    toast('Idee gelöscht');
  });
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space' || e.repeat) return;
    const t = e.target;
    if (t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && /^(text|number|search)$/.test(t.type)) || t.isContentEditable)) return;
    e.preventDefault(); togglePlay();
  });
}

/* ---------- Start ---------- */
wire();
{ const v = LS.get('rsb:view'); if (v === 'beat' || v === 'sound' || v === 'ideas') setView(v); }
Store.initLocal();
(function boot() {
  let draft = null;
  try { draft = JSON.parse(LS.get('rsb:draft') || 'null'); } catch (e) { draft = null; }
  if (draft && draft.id) loadIdea(draft);
  else loadIdea(TEMPLATES.hardbounce(), { draft: true });
})();
Store.initCloud();
})();
</script>
